          - paragraph [ref=f8e32]: A Heat Vulnerability Index 4 to 5 neighborhood with no spray showers and no misting stations. There is nothing here to be a quarter mile away from. The claim covers none of North Corona's sidewalk network, because the network leads nowhere.
